name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spoken-ukrainian
    env:
      SPOKEN_SOURCE: ${{ github.workspace }}/spoken-wow
      CLASSICUA_SOURCE: ${{ github.workspace }}/ClassicUA
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out Spoken Ukrainian
        uses: actions/checkout@v6
        with:
          path: spoken-ukrainian
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: spoken-ukrainian/uv.lock

      - name: Manage Python 3.12 with uv
        run: uv python install 3.12

      - name: Validate uv lock and initialize Python environment
        run: uv sync --locked

      - name: Validate project version and changelog
        run: uv run --locked python tools/version.py check

      - name: Validate project version tag
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: uv run --locked python tools/version.py check --tag "$VERSION_TAG"

      - name: Read pinned Spoken revision
        id: spoken
        run: uv run --locked python -c 'import json; print("revision=" + json.load(open("sources.lock.json"))["spoken"]["revision"])' >> "$GITHUB_OUTPUT"

      - name: Check out pinned Spoken source
        uses: actions/checkout@v6
        with:
          repository: rusty-key/spoken-wow
          ref: ${{ steps.spoken.outputs.revision }}
          path: spoken-wow
          persist-credentials: false

      - name: Read pinned ClassicUA revision
        id: classicua
        run: uv run --locked python -c 'import json; print("revision=" + json.load(open("sources.lock.json"))["classicua"]["revision"])' >> "$GITHUB_OUTPUT"

      - name: Check out pinned ClassicUA source
        uses: actions/checkout@v6
        with:
          repository: greenya/ClassicUA
          ref: ${{ steps.classicua.outputs.revision }}
          path: ClassicUA
          persist-credentials: false

      - name: Install Lua shared library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y liblua5.4-0

      - name: Build diagnostic pack
        run: uv run --locked python tools/build.py

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build local-test Spoken Ukrainian Quest module including Gossip (mandatory 1:1 auto-import)
        run: |
          uv run --locked python tools/build_ukrainian.py \
            --classicua "$CLASSICUA_SOURCE" \
            --spoken "$SPOKEN_SOURCE"
          uv run --locked python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p = Path("dist/Spoken_Ukrainian_Quest_Local_Test.zip")
          with ZipFile(p) as z:
              names = set(z.namelist())
              assert "Spoken_Ukrainian/Spoken_Ukrainian.toc" in names
              assert "Spoken_Quests_UA/Spoken_Quests_UA.toc" in names
              assert "Spoken_Quests_UA/Translations.lua" in names
              assert "Spoken_Quests_UA/Module.lua" in names
              assert "Spoken_Quests_UA/GossipQuestTitles.lua" in names
              assert "Spoken_Quests_UA/GossipFrame.lua" in names
              assert "Spoken_Quests_UA/GossipTranslations.lua" in names
              assert not any(name.startswith("Spoken_Gossip_UA/") for name in names)
              assert "SpokenUkrainian.GossipTexts = {" in z.read("Spoken_Quests_UA/GossipTranslations.lua").decode("utf-8")
              corpus = z.read("Spoken_Quests_UA/Translations.lua").decode("utf-8")
              assert "SpokenUkrainian.GossipQuestTitles = {" in corpus
              assert "[97279] = \"Загублена зброя\"" in corpus
              # Pinned ClassicUA+Spoken: exact 97279 accept/progress/complete
              # were absent solely because Spoken's faction metadata was unknown.
              spoken_rows = corpus.split("SpokenUkrainian.QuestTranslations = {", 1)[1]
              record = spoken_rows.split("    [97279] = {", 1)[1].split("    },", 1)[0]
              assert all(event + " = { text =" in record
                         for event in ("accept", "progress", "complete"))
              assert not any(name.endswith(".mp3") or "Spoken_Quests/" in name for name in names)
              assert z.testzip() is None
          print("Local Quest test pack: structure valid (not uploaded).")
          PY

      - name: Smoke-test local AddOns installer without touching upstream
        run: |
          mkdir -p build/install-ci/Interface/AddOns/Spoken
          mkdir -p build/install-ci/Interface/AddOns/Spoken_Quests
          echo official > build/install-ci/Interface/AddOns/Spoken/Spoken.toc
          echo official > build/install-ci/Interface/AddOns/Spoken_Quests/Spoken_Quests.toc
          uv run --locked python tools/install_addon.py --addons build/install-ci/Interface/AddOns --dry-run
          uv run --locked python tools/install_addon.py --addons build/install-ci/Interface/AddOns
          uv run --locked python - <<'PY'
          from pathlib import Path
          base = Path("build/install-ci/Interface/AddOns")
          assert (base / "Spoken/Spoken.toc").read_text().strip() == "official"
          assert (base / "Spoken_Quests/Spoken_Quests.toc").read_text().strip() == "official"
          assert (base / "Spoken_Ukrainian/Spoken_Ukrainian.toc").is_file()
          assert (base / "Spoken_Quests_UA/Translations.lua").is_file()
          assert (base / "Spoken_Quests_UA/NativeQuestFrame.lua").is_file()
          assert (base / "Spoken_Quests_UA/GossipFrame.lua").is_file()
          assert (base / "Spoken_Quests_UA/GossipTranslations.lua").is_file()
          assert not (base / "Spoken_Gossip_UA").exists()
          print("Local test ZIP installed; official Spoken preserved.")
          PY

      - name: Audit full pinned Gossip NPC corpus against ClassicUA hashes
        run: |
          uv run --locked python tools/gossip_coverage.py \
            --classicua "$CLASSICUA_SOURCE" \
            --spoken "$SPOKEN_SOURCE"
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/gossip-coverage.json").read_text(encoding="utf-8"))
          s = r["summary"]
          assert s["total_gossip_npcs"] > 0
          assert s["total_gossip_npcs"] == s["covered_gossip_npcs"] + s["untranslated_gossip_npcs"]
          assert s["covered_distinct_npc_wordings"] == (
              s["wordings_matched_by_npc_hash"] + s["wordings_matched_by_common_hash"])
          assert s["total_distinct_npc_wordings"] == (
              s["covered_distinct_npc_wordings"] + s["untranslated_distinct_npc_wordings"])
          print("Gossip coverage audit OK")
          PY

      - name: Validate private deduplicated Gossip translation queue
        run: |
          uv run --locked python tools/gossip_translation_review.py queue \
            --classicua "$CLASSICUA_SOURCE" \
            --spoken "$SPOKEN_SOURCE" --batch-size 40
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path("build/gossip-translation-queue.json").read_text(encoding="utf-8"))
          s = q["summary"]
          coverage = json.loads(Path("build/gossip-coverage.json").read_text(encoding="utf-8"))["summary"]
          assert s["untranslated_npc_wordings_queued"] <= coverage["untranslated_distinct_npc_wordings"]
          assert s["unique_english_texts_to_translate"] > 0
          assert s["untranslated_npc_wordings_queued"] > s["unique_english_texts_to_translate"]
          assert all(g["occurrence_count"] == len(g["contexts"]) for g in q["groups"])
          assert Path("build/gossip-batches/batch-0001.json").exists()
          print("Unique Gossip translation candidates:", s["unique_english_texts_to_translate"])
          print("Private queue only; no model calls or approved imports.")
          PY

      - name: Capture and validate pinned source revision history
        run: |
          uv run --locked python tools/source_revision_review.py capture \
            --classicua "$CLASSICUA_SOURCE" \
            --spoken "$SPOKEN_SOURCE" > build/source-review-capture.json
          uv run --locked python tools/source_revision_review.py revisions \
            > build/source-review-revisions.json
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          capture = json.loads(Path("build/source-review-capture.json").read_text(encoding="utf-8"))
          revisions = json.loads(Path("build/source-review-revisions.json").read_text(encoding="utf-8"))
          assert capture["provider"] == "classicua"
          assert capture["records"] > 0
          assert len(revisions["revisions"]) >= 1
          print("Audited source revision history captured without activation")
          PY

      - name: Upload metadata-only Gossip coverage report
        uses: actions/upload-artifact@v4
        with:
          name: pinned-gossip-coverage
          path: |
            spoken-ukrainian/build/gossip-coverage.json
            spoken-ukrainian/build/gossip-untranslated-npcs.csv
          if-no-files-found: error
          retention-days: 7

      - name: Validate real pinned Spoken source-coverage dry-run
        run: uv run --locked python tools/stage4_coverage.py --spoken "$SPOKEN_SOURCE"

      - name: Validate full canonical client-locale coverage with empty policy
        run: |
          uv run --locked python tools/stage4_coverage.py \
            --spoken "$SPOKEN_SOURCE" \
            --policy config/examples/client-language.json \
            --client-locale deDE \
            --output build/stage4-client-language-coverage.json
          uv run --locked python -c 'import json; r=json.load(open("build/stage4-client-language-coverage.json")); c=r["coverage"]; assert c["client_language_selected"] == c["total_spoken_identities"]; assert c["without_verified_public_original"] > 0; assert r["stages"] == []; assert all(row["status"] == "client_language" and row["client_locale"] == "deDE" for row in r["records"])'

      - name: Validate real pinned Stage 4B Quest review queue
        run: |
          uv run --locked python tools/stage4b_workbench.py \
            --classicua "$CLASSICUA_SOURCE" \
            --spoken "$SPOKEN_SOURCE" \
            --faction horde --limit 40
          uv run --locked python -c 'import json; r=json.load(open("build/stage4b-review-queue.json")); s=r["summary"]; assert r["family"]=="quest"; assert 0<len(r["queue"])<=40; assert s["new_identity_approvals_created"]==0; assert s["human_stage3_approved_joins"]==0; assert s["translation_content_approvals_created"]==0; assert all(row["status"]=="identity_review_required" for row in r["queue"])'

          uv run --locked python -c 'import csv; p="build/stage4b-review-worksheet.csv"; rows=list(csv.DictReader(open(p,encoding="utf-8",newline=""))); assert len(rows)>=40; assert all(r["review_check"]=="requires_independent_context_verification" and r["source_id"] and r["target_id"] and r["source_context_sha256"] and r["target_context_sha256"] for r in rows); assert not any("original_text" in r or "translated_text" in r for r in rows); print("Stage 4B review rows:",len(rows))'

      - name: Upload metadata-only initial Quest review worksheet
        uses: actions/upload-artifact@v4
        with:
          name: stage4b-first-40-horde-quest-review
          path: |
            spoken-ukrainian/build/stage4b-review-queue.json
            spoken-ukrainian/build/stage4b-review-worksheet.csv
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test local review UI against both real pinned inventories
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from tools.review_ui_server import build_state
          source = Path(os.environ["CLASSICUA_SOURCE"])
          spoken = Path(os.environ["SPOKEN_SOURCE"])
          decisions = Path("build/ui-ci-decisions.json")
          state = build_state(source, spoken, decisions)
          page = state.page("horde", 0, 12)
          assert page["scope"] == "local_review_only_no_approval"
          assert page["items"] and len(page["items"]) <= 12
          assert page["summary"]["human_stage3_approved_joins"] == 0
          assert page["summary"]["new_identity_approvals_created"] == 0
          assert page["summary"]["translation_content_approvals_created"] == 0
          assert all(isinstance(item["ukrainian_text"], str)
                     and item["ukrainian_text"] for item in page["items"])
          assert all(option["english_original"] is None or option["english_verified"]
                     for item in page["items"] for option in item["target_options"])
          assert not decisions.exists()
          print("Local review UI pinned-source smoke: OK; rows:", len(page["items"]))
          PY
