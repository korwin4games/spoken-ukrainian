name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spoken-ukrainian
    env:
      SPOKEN_SOURCE: ${{ github.workspace }}/spoken-wow
      CLASSICUA_SOURCE: ${{ github.workspace }}/ClassicUA
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out Spoken Ukrainian
        uses: actions/checkout@v6
        with:
          path: spoken-ukrainian
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project version and changelog
        run: python3 tools/version.py check

      - name: Validate project version tag
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: python3 tools/version.py check --tag "$VERSION_TAG"

      - name: Read pinned Spoken revision
        id: spoken
        run: python3 -c 'import json; print("revision=" + json.load(open("sources.lock.json"))["spoken"]["revision"])' >> "$GITHUB_OUTPUT"

      - name: Check out pinned Spoken source
        uses: actions/checkout@v6
        with:
          repository: rusty-key/spoken-wow
          ref: ${{ steps.spoken.outputs.revision }}
          path: spoken-wow
          persist-credentials: false

      - name: Read pinned ClassicUA revision
        id: classicua
        run: python3 -c 'import json; print("revision=" + json.load(open("sources.lock.json"))["classicua"]["revision"])' >> "$GITHUB_OUTPUT"

      - name: Check out pinned ClassicUA source
        uses: actions/checkout@v6
        with:
          repository: greenya/ClassicUA
          ref: ${{ steps.classicua.outputs.revision }}
          path: ClassicUA
          persist-credentials: false

      - name: Install Lua shared library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y liblua5.4-0

      - name: Build diagnostic pack
        run: python3 tools/build.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate real pinned Spoken source-coverage dry-run
        run: python3 tools/stage4_coverage.py --spoken "$SPOKEN_SOURCE"

      - name: Validate full canonical client-locale coverage with empty policy
        run: |
          python3 tools/stage4_coverage.py \
            --spoken "$SPOKEN_SOURCE" \
            --policy config/examples/client-language.json \
            --client-locale deDE \
            --output build/stage4-client-language-coverage.json
          python3 -c 'import json; r=json.load(open("build/stage4-client-language-coverage.json")); c=r["coverage"]; assert c["client_language_selected"] == c["total_spoken_identities"]; assert c["without_verified_public_original"] > 0; assert r["stages"] == []; assert all(row["status"] == "client_language" and row["client_locale"] == "deDE" for row in r["records"])'

      - name: Validate real pinned Stage 4B Quest review queue
        run: |
          python3 tools/stage4b_workbench.py \
            --classicua "$CLASSICUA_SOURCE" \
            --spoken "$SPOKEN_SOURCE" \
            --faction horde --limit 40
          python3 -c 'import json; r=json.load(open("build/stage4b-review-queue.json")); s=r["summary"]; assert r["family"]=="quest"; assert 0<len(r["queue"])<=40; assert s["new_identity_approvals_created"]==0; assert s["human_stage3_approved_joins"]==0; assert s["translation_content_approvals_created"]==0; assert all(row["status"]=="identity_review_required" for row in r["queue"])'
